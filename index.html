<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snally — A Home for Experiments</title>

    <meta
      name="description"
      content="Snally is a home for small web builds, data projects, and technical experiments."
    >
    <meta name="theme-color" content="#0c0118">
    <meta name="color-scheme" content="dark">

    <link rel="canonical" href="https://snally.com/">
    <link rel="icon" href="/assets/snally-logo.png" type="image/png">
    <link rel="preload" as="image" href="/assets/snally-logo.png">

    <meta property="og:site_name" content="Snally">
    <meta property="og:title" content="Snally — A Home for Experiments">
    <meta
      property="og:description"
      content="A home for small web builds, data projects, and technical experiments."
    >
    <meta property="og:url" content="https://snally.com/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://snally.com/assets/snally-logo.png">
    <meta property="og:image:alt" content="Snally logo">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Snally — A Home for Experiments">
    <meta
      name="twitter:description"
      content="A home for small web builds, data projects, and technical experiments."
    >
    <meta name="twitter:image" content="https://snally.com/assets/snally-logo.png">
    <meta name="twitter:image:alt" content="Snally logo">

    <link rel="stylesheet" href="/style.css">

    <meta name="robots" content="index,follow">
  </head>
  <body>
    <main class="landing">
      <div class="intro">
        <img
          src="/assets/snally-logo.png"
          alt=""
          class="logo"
          width="1024"
          height="1024"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        >

        <h1 class="brand">Snally</h1>

        <p class="statement">A home for experiments.</p>

        <p class="summary">
          Small web builds, data projects, and ideas that do not need to become products.
        </p>

        <nav class="links" aria-label="Snally links">
          <a href="https://github.com/snally-dev" rel="me">GitHub</a>
        </nav>

        <img
          src="/assets/charging-snally.png"
          alt=""
          class="mascot"
          width="500"
          height="375"
          loading="eager"
          decoding="async"
        >
      </div>
    </main>
  </body>
</html>
